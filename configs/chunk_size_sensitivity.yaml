# Experiment 1 -- Chunk-size sensitivity.
#
# Varies: chunk size (and, in the companion config, chunking strategy).
# Held fixed: corpus, k, eval question set, embedding model, generation model.
#
# The hypothesis is mechanical: as chunk size shrinks below the length of a
# planted fact, the fact gets severed across a boundary and no single chunk
# remains answer-bearing, so retrieval collapses. Large chunks retrieve the fact
# reliably but dilute it with filler, which is a generation problem rather than
# a retrieval one -- which is why both metric families are reported.

name: chunk_size_sensitivity
description: >
  Sweep chunk size against a fixed corpus and eval set, measuring retrieval
  quality and answer quality separately.
seed: 20260917

corpus:
  n_relevant_docs: 40
  distractor_ratio: 0.0      # no distractors: this experiment is about chunking alone
  filler_sentences_per_doc: 6
  seed: 20260917

chunking:
  strategy: fixed
  chunk_size: 400
  chunk_overlap: 0           # zero overlap, so a severed fact stays severed

embedding:
  model_name: all-MiniLM-L6-v2
  batch_size: 64
  normalize: true

retrieval:
  k: 5
  index_type: flat

generation:
  model: claude-opus-5
  max_tokens: 1024
  effort: low
  use_cache: true

judge:
  model: claude-opus-5
  max_tokens: 512
  effort: low
  use_cache: true

sweep:
  chunking.chunk_size: [64, 128, 200, 300, 400, 600, 800, 1200]
