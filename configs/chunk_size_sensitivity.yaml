# Experiment 1 -- Chunk-size sensitivity.
#
# Varies: chunk size (and, in the companion config, chunking strategy).
# Held fixed: corpus, k, eval question set, embedding model, generation model.
#
# The hypothesis is mechanical: as chunk size shrinks below the length of a
# planted fact, the fact gets severed across a boundary and no single chunk
# remains answer-bearing, so retrieval collapses. Large chunks retrieve the fact
# reliably but dilute it with filler, which is a generation problem rather than
# a retrieval one -- which is why both metric families are reported.

name: chunk_size_sensitivity
description: >
  Sweep chunk size against a fixed corpus and eval set, measuring retrieval
  quality and answer quality separately.
seed: 20260917

corpus:
  n_relevant_docs: 80
  distractor_ratio: 0.0      # no distractors: this experiment is about chunking alone
  filler_sentences_per_doc: 6
  fact_sentences: 3          # facts span setup/value/elaboration, not one tidy sentence
  seed: 20260917

chunking:
  strategy: fixed
  chunk_size: 400
  chunk_overlap: 0           # zero overlap, so a severed fact stays severed

embedding:
  model_name: all-MiniLM-L6-v2
  batch_size: 64
  normalize: true

retrieval:
  k: 5
  index_type: flat

generation:
  model: claude-opus-5
  max_tokens: 1024
  effort: low
  use_cache: true
  # Sequential, not batched. Batching halves cost, but the implementation
  # submits two batches per condition and polls each to completion, so a sweep
  # means dozens of serialized round-trips with unpredictable wall-clock. The
  # few dollars saved are not worth the uncertainty; `--batch` still overrides.
  use_batch: false

judge:
  model: claude-opus-5
  max_tokens: 512
  effort: low
  use_cache: true

sweep:
  # Documents run 611-762 characters, so any chunk size at or above 762 yields
  # exactly one chunk per document and every such condition is the same
  # condition. 800 and 1200 were byte-identical for that reason; 1200 is dropped
  # and the budget spent instead on 500 and 700, which sit inside the range
  # where a chunk boundary can still fall within a document.
  #
  # Both new points probe the same claim -- that a chunk size slightly below
  # document length severs facts into an unretrievable tail -- and they probe it
  # in opposite directions. 500 resolves whether the fall from 400 (acc 0.988)
  # to 600 (acc 0.875) is a smooth decline or a cliff. 700 splits only the
  # minority of documents longer than 700, leaving a tail of 1-62 characters:
  # the most extreme stub in the sweep, but affecting fewest documents, so the
  # trap hypothesis predicts a *shallower* dip there than at 600.
  chunking.chunk_size: [64, 128, 200, 300, 400, 500, 600, 700, 800]
